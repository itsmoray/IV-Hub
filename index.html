<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Industrial Visit Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d2b3e'/%3E%3Cpath d='M18 38a14 14 0 0 1 28 0z' fill='%23f2a33a'/%3E%3Cpath d='M8 44q6-5 12 0t12 0 12 0 12 0' stroke='%233fb5c2' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 52q6-5 12 0t12 0 12 0 12 0' stroke='%230f7c8a' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d2b3e">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2b3e;--sea:#0f7c8a;--foam:#e3f1f2;--bg:#f0f4f6;--line:#d9e3e8;--mut:#5f7686;--sun:#f2a33a;--bad:#d9482b;--ok:#1b9a62;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.num{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--sun);z-index:99;transition:width .3s}
/* logo + splash */
.logo{width:40px;height:40px;flex:none;display:block}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.brandrow .brand{padding:0}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 90% at 50% 0%,#14677a 0%,#0d2b3e 62%);color:#fff;padding:24px;text-align:center;transition:opacity .45s,visibility .45s}
#splash.off{opacity:0;visibility:hidden}
#splash svg{width:104px;height:104px;border-radius:26px;animation:glow 2.4s ease-out infinite}
#splash h1{font-size:25px;margin-top:6px}
#splash p{color:#a9cbd6;font-size:14px;min-height:20px;max-width:300px}
.sun{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.w1{animation:drift 2.4s ease-in-out infinite alternate}
.w2{animation:drift 2.4s ease-in-out infinite alternate-reverse}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
@keyframes glow{0%{box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 0 rgba(242,163,58,.35)}100%{box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 26px rgba(242,163,58,0)}}
.ld{width:140px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.ld i{display:block;height:100%;width:40%;border-radius:9px;background:var(--sun);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
/* busy overlay: blocks every click and key while the app talks to the server */
#busy{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(13,43,62,.28);cursor:progress}
#busy.on{display:grid}
#busy .bx{background:#fff;border-radius:16px;padding:18px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#busy.show .bx{opacity:1;transform:none}
.spin{width:24px;height:24px;flex:none;border-radius:50%;border:3px solid var(--foam);border-top-color:var(--sea);border-right-color:var(--sun);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a.ghost{color:var(--ink)}
/* fab */
.fab{position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;border:0;background:var(--sun);color:#2a1a00;font-size:30px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:45;display:none}
@media(max-width:860px){.fab:not([hidden]){display:block}}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0d2b3e 0%,#0f5f6e 60%,#0f7c8a 100%)}
.lbox{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lbox h1{font-size:30px;line-height:1.1;margin-bottom:6px}
.lbox p{color:var(--mut);margin-bottom:22px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--mut);margin-bottom:14px}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:500;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none}
.pri{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.pri:hover{background:#0b6a76}.pri:disabled{opacity:.6}
.ghost{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600}
.danger{background:#fff;border:1.5px solid #f0c3b8;color:var(--bad);border-radius:10px;padding:10px 16px;font-weight:600}
.err{color:var(--bad);font-weight:600;min-height:20px;font-size:13px;margin-bottom:8px}
.lbox .pri{width:100%}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ink);color:#cfe0e8;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-size:19px;font-weight:700;padding:0 10px 4px;line-height:1.2}
.route{padding:0 10px 18px;font-size:12.5px;color:#8fb2c0}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600}
aside nav button:hover{background:#17435c}
aside nav button.on{background:var(--sun);color:#2a1a00}
.me{margin-top:auto;padding:12px 10px 0;border-top:1px solid #1f4a63;font-size:13px}
.me b{color:#fff;display:block}
.me button{background:none;border:0;color:#8fb2c0;padding:6px 0;font-weight:600;text-decoration:underline}
main{padding:26px 30px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:28px}
#actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px}
.kpi small{color:var(--mut);font-weight:600;display:block}
.kpi .num{font-size:27px;font-weight:700;margin:2px 0}
.kpi em{font-style:normal;font-size:12.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.flow{height:30px;border-radius:9px;overflow:hidden;display:flex;background:#cfe3e6;margin:6px 0 14px}
.flow i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px}
.leg div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.leg s{width:11px;height:11px;border-radius:3px;flex:none}
.leg span{margin-left:auto;font-weight:700}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafb}
td{padding:10px 14px;border-bottom:1px solid #edf2f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.k{cursor:pointer}tr.k:hover td{background:#f6fafb}
.r{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.c-ok{background:#dff3e9;color:#12754a}.c-part{background:#fdf0d8;color:#99620a}.c-no{background:#fbe3dc;color:#a83a21}.c-n{background:var(--foam);color:#0b6a76}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{max-width:280px}.tools select{max-width:200px}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acc .card b.num{font-size:24px;display:block}
.acc .row2{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-top:4px}
.prog{height:8px;background:var(--foam);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--sea)}
.mut{color:var(--mut)}.empty{padding:34px;text-align:center;color:var(--mut)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,30,44,.55);display:none;place-items:center;padding:16px;z-index:50}
#modal.on{display:grid}
.sheet{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.sheet h3{font-size:21px;margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);display:flex;align-items:center;gap:10px;max-width:90vw;background:var(--ink);color:#fff;padding:11px 18px 11px 12px;border-radius:14px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast .ti{width:24px;height:24px;flex:none;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:13px;font-weight:800}
#toast.err .ti{background:var(--bad)}#toast.info .ti{background:var(--sun);color:#2a1a00}
@media(max-width:860px){#toast{bottom:calc(86px + env(safe-area-inset-bottom))}}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:40;overflow-x:auto}
 .brand,.brandrow,.route,.me{display:none}
 aside nav{flex-direction:row;gap:4px}aside nav button{white-space:nowrap;padding:9px 12px}
 main{padding:18px 14px 90px}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top h2{font-size:23px}
 .mob{display:inline-block!important}
}
.mob{display:none}
/* phone layout */
body{-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.k3{grid-template-columns:repeat(3,1fr)}
.qrw{display:block}
@media(max-width:860px){
 aside{padding-bottom:calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
 aside::-webkit-scrollbar{display:none}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 .fab{bottom:calc(80px + env(safe-area-inset-bottom))}
 button,.pri,.ghost,.danger{min-height:42px}
 .tools input,.tools select{max-width:none;flex:1 1 140px}
 #actions{width:100%}#actions>*{flex:1 1 auto}
 .k3 .num{font-size:19px}.kpi{padding:12px 14px}.kpi .num{font-size:23px}
 .qrw{display:none}.qrw.on{display:block}
 .card{padding:16px}
}
@media(max-width:700px){
 #modal{place-items:end center;padding:0}
 .sheet{max-width:100%;border-radius:18px 18px 0 0;max-height:90vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
 .tw{border:0;background:none;overflow:visible}
 table,thead,tbody,tr,td{display:block}
 thead{display:none}
 tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px}
 td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0!important;border:0!important;text-align:right;background:none!important}
 td::before{content:attr(data-l);color:var(--mut);font-weight:600;font-size:12.5px;text-align:left;flex:none}
 td[data-l='']::before{content:none}
 td[colspan]{display:block;text-align:center}td[colspan]::before{content:none}
 tr.k:active{background:var(--foam)}
}
@media print{aside,#actions,.tools,#modal{display:none!important}#app{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0d2b3e"/><path d="M18 38a14 14 0 0 1 28 0z" fill="#f2a33a"/><path d="M8 44q6-5 12 0t12 0 12 0 12 0" stroke="#3fb5c2" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M8 52q6-5 12 0t12 0 12 0 12 0" stroke="#0f7c8a" stroke-width="3.5" fill="none" stroke-linecap="round"/></symbol></svg>

 <h1>Industrial Visit Ledger</h1><p id="sp">Getting your trip books ready</p><div class="ld"><i></i></div>
</div>
<div id="login" hidden>
 <form class="lbox" id="lf">
  <svg class="logo" style="width:54px;height:54px;margin-bottom:14px"><use href="#logo"/></svg>

 </aside>

</div>

<button class="fab" id="fab" aria-label="Quick add" hidden>+</button>
<div id="modal"></div><div id="toast"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzrqSUyyDn3OU4fimczNEZj5ImJ702L3_Lhe86TVZzLQtNG8Se4QMZqJcNgYRUSJ1nI/exec';
const S={t:localStorage.ivTok||'',u:null,d:null,page:'dash',q:'',f:'',rf:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const lbl=()=>document.querySelectorAll('#view table').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>{if(!c.hasAttribute('colspan'))c.dataset.l=h[i]||''}))});
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
const sum=a=>a.reduce((t,x)=>t+Number(x.amount||0),0);
const psum=a=>a.reduce((t,x)=>t+(x.kind==='refund'?-1:1)*Number(x.amount||0),0);
const L=(c,g,s)=>s.split('|').map(n=>({name:n.trim(),class:c,gender:g,type:'Student'}));
const STUDENTS=[...L('BCA','Boy','Abhinav Gopal|Midhun P Vinod|Jiswin|Britto|Albin|Amalnadh K|M N Vishnu Narayan|Abhiram|Gokul Deepak Warrier|Gowtham Krishna|Midhilaj|Uday Krishna S|Abhishek|Mohammad P.S|Abhinav NM|Abhijith Arun|Josukutty|Tiwin Joseph|Aalap|Pranav Rajesh|Aman CS|Praveen|Nevin|Mohammad Raiyan|Athul Krishna MA|Mohammad Jasin|Aadith Bobby|Rohith B K'),...L('BCA','Girl','Goury Parvathy|Mayooka|Archa|Fathima Nazrin|Sayyana|Gopika|Devika Prakash|Fathima Riya|Shereena|Hima|Shamna|Meenu|Vaika|Ganga|Keerthana|Benitta Reji|Aswathy KP|Fathimath Shabana T|Fasna K'),...L('BSc','Boy','Adithya Jyothi|Albin Thomas Moncy|Alwin B Manoj|Geever Jomon|Muhammed Adhil K|Navthej S S|P Premraj|Roufmon|Sivan P|Vyshakh M M|Nidhun'),...L('BSc','Girl','Archana Sivan|Aswathy Pradeep|Meera Krishna M B|Devika CR|Fathima Dina N')];
const COL=['#0f7c8a','#f2a33a','#d9482b','#5b6ee1','#1b9a62','#8e5bd1','#c2a14d','#4a90a4'];
const can=l=>({viewer:0,editor:1,admin:2}[S.u.role]>=l);
const cfg=()=>S.d.config;
const cats=()=>(cfg().categories||'Miscellaneous').split(',').map(x=>x.trim()).filter(Boolean);
const feeOf=p=>p.status==='Cancelled'?0:(Number(p.fee)||Number(cfg().fee)||0);
const budget=()=>{try{return JSON.parse(cfg().budget||'{}')}catch(e){return{}}};
const paidBy=id=>psum(S.d.payments.filter(x=>x.participantId===id));
const accName=id=>(S.d.accounts.find(a=>a.id===id)||{name:'(deleted)'}).name;
const uname=id=>((S.d.users||[]).find(u=>u.participantId===id)||{}).username||'';
const loginBox=id=>{const u=(S.d.users||[]).find(x=>x.participantId===id);return`<div style="margin:10px 0 0;padding:10px 12px;background:var(--foam);border-radius:10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">${u?`<span>Login: <b>${esc(u.username)}</b> <span class="chip ${u.active==='Yes'?'c-ok':'c-no'}">${u.active==='Yes'?'Active':'Disabled'}</span></span><button class="ghost" style="padding:5px 12px" data-act="set-pw" data-id="${u.id}">Set new password</button>`:`<span class="mut">No login yet</span><button class="ghost" style="padding:5px 12px" data-act="mk-one" data-id="${id}">Create login</button>`}</div>`};
const tin=id=>sum((S.d.transfers||[]).filter(t=>t.to===id)),tout=id=>sum((S.d.transfers||[]).filter(t=>t.from===id));
const wa=(p,msg)=>{let n=String(p.phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')};
const pName=id=>(S.d.participants.find(p=>p.id===id)||{name:'(deleted)'}).name;
const status=p=>{if(p.status==='Cancelled')return['Cancelled','c-n'];const f=feeOf(p),x=paidBy(p.id);return f>0&&x>=f?['Paid','c-ok']:x>0?['Partial','c-part']:['Unpaid','c-no']};
let TT=null,AC=null,LASTP=null;
const SND=()=>localStorage.ivSound!=='off';
function tone(seq){if(!SND())return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime+.02;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);t+=d*.8})}catch(e){}}
const chime=()=>tone([[659,.12],[880,.12],[1175,.3]]),ding=()=>tone([[988,.14],[1319,.14],[988,.14],[1319,.34]]);
const toast=(m,t)=>{const e=$('#toast');e.className=t||'';e.innerHTML='<span class="ti">'+(t==='err'?'!':t==='info'?'🔔':'✓')+'</span><span>'+esc(m)+'</span>';void e.offsetWidth;e.classList.add('on');if(!t)chime();clearTimeout(TT);TT=setTimeout(()=>e.classList.remove('on'),t==='info'?5000:2600)};

function busy(on,lbl){
 const o=$('#busy');
 if(on){
  NB++;clearTimeout(BH);o.classList.add('on');$('#bl').textContent=lbl||'Saving…';
  if(NB===1){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();LOCKS.forEach(x=>$(x).setAttribute('inert',''));clearTimeout(BT);BT=setTimeout(()=>o.classList.add('show'),250)}
 }else{
  NB=Math.max(0,NB-1);

 }

// every server call goes through here: one at a time, with the screen locked until it finishes
function api(action,p={},soft){
 const body=JSON.stringify({action,token:S.t,...p}),quiet=action==='logout'||soft===true,lbl=LBL[action]||'Saving…';
 const run=async()=>{
  if(!quiet)busy(true,lbl);
  try{
   const r=await fetch(API_URL,{method:'POST',body});const j=await r.json();
   if(!j.ok){if(/session expired/i.test(j.error))signOut(true);throw new Error(j.error)}
   return j.data;
  }catch(e){throw new Error(e.message==='Failed to fetch'?'Cannot reach the server. Check your internet and the API_URL.':e.message)}
  finally{if(!quiet)busy(false)}
 };
 const pr=Q.then(run,run);Q=pr.catch(()=>{});return pr;
}

async function poll(){
 if(!S.u||!S.d||S.u.role==='student'||!can(1)||document.visibilityState!=='visible'||NB)return;
 try{const r=await api('poll',{},true);
  if(LASTP!==null&&r.pending!==LASTP){const more=r.pending>LASTP;await load(true);if(more){ding();toast('New payment to verify','info')}}
 }catch(e){}
}

function form(title,fields,v,save,opt={}){

  f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(v[f.k]??'')===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
  :f.t==='textarea'?`<textarea name="${f.k}" rows="2">${esc(v[f.k])}</textarea>`
  :`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v[f.k])}" placeholder="${esc(f.p||'')}" ${f.r?'required':''} ${f.t==='number'?'step="any" min="0" inputmode="decimal"':''}>`}</label>`).join('')}
 <div class="err"></div><div class="row">${opt.del?'<button type="button" class="danger" id="dl" style="margin-right:auto">'+(opt.delLabel||'Delete')+'</button>':''}<button type="button" class="ghost" data-close>Cancel</button><button class="pri">Save</button></div></form>`);
 const f=$('#modal form');f.querySelector('input,select')?.focus();
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('.pri');b.disabled=true;
  try{await save(Object.fromEntries(new FormData(f)));close();toast(opt.msg||'Saved')}catch(x){f.querySelector('.err').textContent=x.message;b.disabled=false}};

function csv(name,cols,rows){

}

 'pw':()=>form('Change password',[{l:'Current password',k:'old',t:'password',r:1},{l:'New password (min 6 characters)',k:'pw',t:'password',r:1}],{},r=>api('changePassword',r)),
 'csv-ppl':()=>csv('people',[['Name',p=>p.name],['Type',p=>p.type],['Class',p=>p.class],['Phone',p=>p.phone],['Fee',feeOf],['Paid',p=>paidBy(p.id)],['Due',p=>Math.max(feeOf(p)-paidBy(p.id),0)],['Status',p=>status(p)[0]]],S.d.participants),
 'csv-pay':()=>csv('payments',[['Date',x=>x.date],['Name',x=>pName(x.participantId)],['Amount',x=>x.amount],['Account',x=>accName(x.account)],['Type',x=>x.kind==='refund'?'Refund':'Payment'],['Mode',x=>x.mode],['Reference',x=>x.ref],['Note',x=>x.note],['Entered by',x=>x.by]],S.d.payments),
 'csv-exp':()=>csv('expenses',[['Date',x=>x.date],['Paid to',x=>x.payee],['Category',x=>x.category],['Amount',x=>x.amount],['Paid from',x=>accName(x.account)],['Note',x=>x.note],['Entered by',x=>x.by]],S.d.expenses)
};
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){S.page=g.dataset.go;S.q='';S.f='';S.be=false;draw();scrollTo(0,0);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a.dataset.id);
});
document.addEventListener('input',e=>{
 if(e.target.id==='pa')updPay();
 if(e.target.id==='q'||e.target.id==='f'){S[e.target.id]=e.target.value;if(S.rf){$('#tb').innerHTML=S.rf();lbl()}}
});

/* ---------- boot ---------- */
if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)$('#instl').hidden=true;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{
 const t0=Date.now(),sp=$('#sp'),spl=$('#splash');
 const slow=setTimeout(()=>sp.textContent='Waking up the server, this can take a few seconds…',4500);
 const done=()=>{clearTimeout(slow);setTimeout(()=>{spl.classList.add('off');setTimeout(()=>spl.remove(),600)},Math.max(0,1100-(Date.now()-t0)))};
 const go=async()=>{
  if(!S.t){$('#login').hidden=false;return done()}
  try{await start();done()}
  catch(e){
   if(/Cannot reach/.test(e.message)){
    clearTimeout(slow);sp.textContent='Could not connect. Check your internet and try again.';$('#splash .ld').hidden=true;
    const b=document.createElement('button');b.className='pri';b.textContent='Try again';
    b.onclick=()=>{b.remove();$('#splash .ld').hidden=false;sp.textContent='Connecting…';go()};spl.appendChild(b);
   }else{$('#login').hidden=false;done()}
  }
 };
 go();
})();
</script>
</body>
</html>
