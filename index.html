<style>
:root{--ink:#0d2b3e;--sea:#0f7c8a;--foam:#e3f1f2;--bg:#f0f4f6;--line:#d9e3e8;--mut:#5f7686;--sun:#f2a33a;--bad:#d9482b;--ok:#1b9a62;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.num{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
[hidden]{display:none!important}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--sun);z-index:99;transition:width .3s}
/* logo + splash */
.logo{width:40px;height:40px;flex:none;display:block}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.brandrow .brand{padding:0}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 90% at 50% 0%,#14677a 0%,#0d2b3e 62%);color:#fff;padding:24px;text-align:center;transition:opacity .45s,visibility .45s}
#splash.off{opacity:0;visibility:hidden}
#splash svg{width:104px;height:104px;border-radius:26px;animation:glow 2.4s ease-out infinite}
#splash h1{font-size:25px;margin-top:6px}
#splash p{color:#a9cbd6;font-size:14px;min-height:20px;max-width:300px}
.sun{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.w1{animation:drift 2.4s ease-in-out infinite alternate}
.w2{animation:drift 2.4s ease-in-out infinite alternate-reverse}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
@keyframes glow{0%{box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 0 rgba(242,163,58,.35)}100%{box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 26px rgba(242,163,58,0)}}
.ld{width:140px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.ld i{display:block;height:100%;width:40%;border-radius:9px;background:var(--sun);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
/* busy overlay: blocks every click and key while the app talks to the server */
#busy{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(13,43,62,.28);cursor:progress}
#busy.on{display:grid}
#busy .bx{background:#fff;border-radius:16px;padding:18px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#busy.show .bx{opacity:1;transform:none}
.spin{width:24px;height:24px;flex:none;border-radius:50%;border:3px solid var(--foam);border-top-color:var(--sea);border-right-color:var(--sun);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a.ghost{color:var(--ink)}
/* fab */
.fab{position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;border:0;background:var(--sun);color:#2a1a00;font-size:30px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:45;display:none}
@media(max-width:860px){.fab:not([hidden]){display:block}}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0d2b3e 0%,#0f5f6e 60%,#0f7c8a 100%)}
.lbox{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lbox h1{font-size:30px;line-height:1.1;margin-bottom:6px}
.lbox p{color:var(--mut);margin-bottom:22px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--mut);margin-bottom:14px}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:500;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none}
.pri{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.pri:hover{background:#0b6a76}.pri:disabled{opacity:.6}
.ghost{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600}
.danger{background:#fff;border:1.5px solid #f0c3b8;color:var(--bad);border-radius:10px;padding:10px 16px;font-weight:600}
.err{color:var(--bad);font-weight:600;min-height:20px;font-size:13px;margin-bottom:8px}
.lbox .pri{width:100%}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ink);color:#cfe0e8;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-size:19px;font-weight:700;padding:0 10px 4px;line-height:1.2}
.route{padding:0 10px 18px;font-size:12.5px;color:#8fb2c0}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600}
aside nav button:hover{background:#17435c}
aside nav button.on{background:var(--sun);color:#2a1a00}
.me{margin-top:auto;padding:12px 10px 0;border-top:1px solid #1f4a63;font-size:13px}
.me b{color:#fff;display:block}
.me button{background:none;border:0;color:#8fb2c0;padding:6px 0;font-weight:600;text-decoration:underline}
main{padding:26px 30px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:28px}
#actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{font-size:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px}
.kpi small{color:var(--mut);font-weight:600;display:block}
.kpi .num{font-size:27px;font-weight:700;margin:2px 0}
.kpi em{font-style:normal;font-size:12.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.flow{height:30px;border-radius:9px;overflow:hidden;display:flex;background:#cfe3e6;margin:6px 0 14px}
.flow i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px}
.leg div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.leg s{width:11px;height:11px;border-radius:3px;flex:none}
.leg span{margin-left:auto;font-weight:700}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafb}
td{padding:10px 14px;border-bottom:1px solid #edf2f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.k{cursor:pointer}tr.k:hover td{background:#f6fafb}
.r{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.c-ok{background:#dff3e9;color:#12754a}.c-part{background:#fdf0d8;color:#99620a}.c-no{background:#fbe3dc;color:#a83a21}.c-n{background:var(--foam);color:#0b6a76}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{max-width:280px}.tools select{max-width:200px}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acc .card b.num{font-size:24px;display:block}
.acc .row2{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-top:4px}
.prog{height:8px;background:var(--foam);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--sea)}
.mut{color:var(--mut)}.empty{padding:34px;text-align:center;color:var(--mut)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,30,44,.55);display:none;place-items:center;padding:16px;z-index:50}
#modal.on{display:grid}
.sheet{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.sheet h3{font-size:21px;margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);display:flex;align-items:center;gap:10px;max-width:90vw;background:var(--ink);color:#fff;padding:11px 18px 11px 12px;border-radius:14px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast .ti{width:24px;height:24px;flex:none;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:13px;font-weight:800}
#toast.err .ti{background:var(--bad)}#toast.info .ti{background:var(--sun);color:#2a1a00}
@media(max-width:860px){#toast{bottom:calc(86px + env(safe-area-inset-bottom))}}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:40;overflow-x:auto}
 .brand,.brandrow,.route,.me{display:none}
 aside nav{flex-direction:row;gap:4px}aside nav button{white-space:nowrap;padding:9px 12px}
 main{padding:18px 14px 90px}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top h2{font-size:23px}
 .mob{display:inline-block!important}
}
.mob{display:none}
/* phone layout */
body{-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.k3{grid-template-columns:repeat(3,1fr)}
.qrw{display:block}
@media(max-width:860px){
 aside{padding-bottom:calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
 aside::-webkit-scrollbar{display:none}
 main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 .fab{bottom:calc(80px + env(safe-area-inset-bottom))}
 button,.pri,.ghost,.danger{min-height:42px}
 .tools input,.tools select{max-width:none;flex:1 1 140px}
 #actions{width:100%}#actions>*{flex:1 1 auto}
 .k3 .num{font-size:19px}.kpi{padding:12px 14px}.kpi .num{font-size:23px}
 .qrw{display:flex;justify-content:center;width:100%}.qrw.off{display:none}
 .payw{flex-direction:column;align-items:center;justify-content:center;gap:14px!important}.payc{width:100%;align-items:stretch;text-align:center}
 .card{padding:16px}
}
@media(max-width:700px){
 #modal{place-items:end center;padding:0}
 .sheet{max-width:100%;border-radius:18px 18px 0 0;max-height:90vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
 .tw{border:0;background:none;overflow:visible}
 table,thead,tbody,tr,td{display:block}
 thead{display:none}
 tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px}
 td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0!important;border:0!important;text-align:right;background:none!important}
 td::before{content:attr(data-l);color:var(--mut);font-weight:600;font-size:12.5px;text-align:left;flex:none}
 td[data-l='']::before{content:none}
 td[colspan]{display:block;text-align:center}td[colspan]::before{content:none}
 tr.k:active{background:var(--foam)}
}
/* ===== Polished phone-first UI (visual layer only) ===== */
:root{--sh1:0 1px 2px rgba(13,43,62,.05),0 10px 28px -14px rgba(13,43,62,.16);--sh2:0 2px 4px rgba(13,43,62,.06),0 18px 44px -16px rgba(13,43,62,.28);--ease:cubic-bezier(.2,.8,.2,1)}
body{background:radial-gradient(90% 40% at 100% 0%,#e4f0f2 0%,transparent 70%),var(--bg)}
button,.pri,.ghost,.danger,.card,.kpi,tr.k td{transition:transform .18s var(--ease),box-shadow .2s,background .2s,border-color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}
.card,.kpi,.tw{box-shadow:var(--sh1);border-color:#e3ebef}
.pri{background:linear-gradient(180deg,#13909f,#0f7c8a);box-shadow:0 6px 16px -6px rgba(15,124,138,.6);border-radius:12px}
.ghost,.danger{border-radius:12px}
input,select,textarea{border-radius:12px;padding:12px 14px;background:#fbfdfd}
input:focus,select:focus,textarea:focus{border-color:var(--sea);box-shadow:0 0 0 4px rgba(15,124,138,.14);background:#fff}
.chip{padding:3px 12px}
.kpi .num{letter-spacing:-.02em}
.kpi small{font-size:13px}
.leg div{padding:2px 0}
.mbar{display:none}
.enter>*{animation:up .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
#modal{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal.on{animation:fade .2s both}#modal.on .sheet{animation:sheetUp .34s var(--ease) both}
.sheet{box-shadow:var(--sh2);border-radius:22px}
.lbox{border-radius:26px;padding:38px 30px;animation:sheetUp .6s var(--ease) both}
.lbox h1{font-size:29px}
.lbox label{margin-bottom:16px}
#login{background:radial-gradient(80% 45% at 50% 100%,rgba(15,124,138,.20),transparent 70%),radial-gradient(60% 35% at 100% 0%,rgba(242,163,58,.18),transparent 70%),#f0f4f6}
.lbox{box-shadow:0 24px 60px -22px rgba(13,43,62,.32);border:1px solid #e3ebef}
.fab{transition:transform .3s var(--ease),opacity .3s;box-shadow:0 12px 28px -6px rgba(0,0,0,.4)}
.fab.hide{transform:translateY(130px) scale(.8);opacity:0;pointer-events:none}
.mmenu{position:absolute;top:calc(100% + 6px);right:16px;min-width:210px;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--sh2);border:1px solid var(--line);display:none;transform-origin:top right}
.mmenu.on{display:block;animation:pop .22s var(--ease) both}
.mmenu .who{padding:10px 12px 12px;border-bottom:1px solid #edf2f5;margin-bottom:6px}
.mmenu .who b{display:block;font-size:15px}.mmenu .who span{font-size:12.5px;color:var(--mut);text-transform:capitalize}
.mmenu button{width:100%;text-align:left;background:none;border:0;padding:12px;border-radius:12px;font-weight:700;color:var(--bad);display:flex;align-items:center;gap:10px}
.mmenu button:active{background:#fbe3dc}
@media(max-width:860px){
 .mbar{display:flex;position:sticky;top:0;z-index:35;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;background:rgba(240,244,246,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(13,43,62,.06)}
 .mbar .logo{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 12px -4px rgba(13,43,62,.5)}
 .mbar .mt{flex:1;min-width:0}.mbar .mt b{display:block;font:700 16px/1.2 'Bricolage Grotesque',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mbar .mt span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mbar .av{width:42px;height:42px;min-height:0;border-radius:50%;border:0;background:var(--ink);color:#fff;font:700 16px 'Bricolage Grotesque',sans-serif;display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(13,43,62,.6)}
 main{padding:20px 18px calc(124px + env(safe-area-inset-bottom))}
 .top{margin-bottom:20px;gap:14px}.top h2{font-size:29px;letter-spacing:-.025em}
 #actions>*{min-height:48px}
 .card{padding:20px;border-radius:20px}.card h3{font-size:17px;margin-bottom:14px}
 .kpis{gap:12px;margin-bottom:18px}.kpi{padding:16px;border-radius:18px}.kpi .num{font-size:24px;margin:4px 0 6px}.kpi em{font-size:12.5px;line-height:1.35;display:block}
 .k3 .num{font-size:20px}
 .grid2{gap:18px;margin-top:18px}
 .flow{height:26px;margin:4px 0 18px}
 .leg{grid-template-columns:1fr;gap:0}.leg div{padding:11px 0;border-bottom:1px solid #edf2f5;font-size:14.5px}.leg div:last-child{border:0}
 .acc{gap:16px}
 button,.pri,.ghost,.danger{min-height:46px}
 .tools{gap:12px;margin-bottom:16px}
 aside{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border-radius:24px;padding:7px;gap:6px;box-shadow:0 18px 40px -10px rgba(7,24,36,.55),0 0 0 1px rgba(255,255,255,.06) inset;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
 aside nav{flex:none;gap:6px}
 aside nav button{min-height:46px;padding:0 18px;border-radius:17px;font-size:14.5px;scroll-snap-align:center;color:#b9d3de}
 aside nav button.on{box-shadow:0 6px 16px -6px rgba(242,163,58,.7)}
 .fab{right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px}
 #toast{bottom:calc(98px + env(safe-area-inset-bottom))}
}
@media(max-width:700px){
 .sheet{border-radius:26px 26px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));position:relative}
 .sheet::before{content:'';position:absolute;top:9px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:#d5dfe5}
 .sheet h3{margin-top:4px}
 tr{padding:12px 16px;border-radius:18px;margin-bottom:12px;box-shadow:var(--sh1);border-color:#e3ebef}

}

// Reads pasted people: from Excel (tab separated) or typed (comma separated). Name first; then Age, Gender (Male/Female/Boy/Girl), Class, Phone in any order.
function parsePeople(txt){
 return String(txt||'').split(/\r?\n/).map(l=>l.split(/\t|,/).map(x=>x.trim()).filter(x=>x!=='')).filter(a=>a.length)
  .filter(a=>!/^(s\.?\s*no\.?|sl\.?\s*no\.?|sno|name|student name|names)$/i.test(a[0])&&!a.some(x=>/^(age|gender|sex)$/i.test(x))) // skip the header row
  .map(a=>{if(a.length>1&&/^\d+$/.test(a[0]))a=a.slice(1); // drop a serial-number column
   const o={name:a[0],class:'',phone:'',gender:'',age:''};
   a.slice(1).forEach(x=>{
    if(/^(m|male|boy)$/i.test(x))o.gender='Boy';
    else if(/^(f|female|girl)$/i.test(x))o.gender='Girl';
    else if(/^\d{1,2}$/.test(x)&&!o.age&&Number(x)>=10&&Number(x)<=80)o.age=x;
    else if(/^[+\d][\d\s-]{8,}$/.test(x)&&!o.phone)o.phone=x;
    else if(!o.class)o.class=x;
   });
   return o})}

  {t:()=>tQ('#dock','#nav'),h:'Getting around',b:w?'The bar at the bottom has <b>My fees</b> and <b>Password</b>. Tap your initial at the top right to sign out.':'The menu on the left has <b>My payments</b> and <b>Password</b>. <b>Sign out</b> is at the bottom of the menu.'},

function tourFocus(el){
 if(!el)return;
 for(let n=el;n&&n!==document.body;n=n.parentElement){if(getComputedStyle(n).position==='fixed')return}
 const r=el.getBoundingClientRect();
 if(innerWidth<=700)scrollBy(0,r.top-92);
 else if(r.top<80||r.bottom>innerHeight-80)scrollBy(0,r.top-innerHeight*.25)
}
function tourPos(){
 if(!TOUR)return;
 const T=$('#tour');if(!T)return;
 const s=TOUR.steps[TOUR.i],card=T.querySelector('.tr-card'),hole=T.querySelector('.tr-hole'),vw=innerWidth,vh=innerHeight,g=14;
 let el=null;try{el=s.t?s.t():null}catch(x){}
 card.style.top=card.style.bottom=card.style.left='';
 const cw=card.offsetWidth,ch=card.offsetHeight;
 const r=tVis(el)?el.getBoundingClientRect():null;
 if(!r||r.bottom<=0||r.top>=vh){
  T.classList.add('nt');
  if(vw<=700)card.style.bottom='calc(12px + env(safe-area-inset-bottom))';
  else{card.style.left=Math.round((vw-cw)/2)+'px';card.style.top=Math.max(12,Math.round((vh-ch)/2))+'px'}
  return;
 }
 T.classList.remove('nt');
 const pad=6,x=Math.max(r.left-pad,6),y=Math.max(r.top-pad,6),w=Math.min(r.right+pad,vw-6)-x,h=Math.min(Math.min(r.bottom+pad,vh-6)-y,Math.max(vh*.45,110));
 const rad=(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0)+pad;
 hole.style.left=x+'px';hole.style.top=y+'px';hole.style.width=w+'px';hole.style.height=h+'px';hole.style.borderRadius=Math.max(10,rad)+'px';
 if(vw<=700){
  const below=vh-(y+h),above=y;
  if(below>=ch+24||below>=above)card.style.bottom='calc(12px + env(safe-area-inset-bottom))';
  else card.style.top='calc(12px + env(safe-area-inset-top))';
 }else{
  const cl=(v,a,b)=>Math.max(a,Math.min(v,b));let L,Tp;
  if(y+h+g+ch<=vh-12){Tp=y+h+g;L=cl(x,12,vw-cw-12)}
  else if(y-g-ch>=12){Tp=y-g-ch;L=cl(x,12,vw-cw-12)}
  else if(x+w+g+cw<=vw-12){L=x+w+g;Tp=cl(y,12,vh-ch-12)}
  else if(x-g-cw>=12){L=x-g-cw;Tp=cl(y,12,vh-ch-12)}
  else{L=Math.round((vw-cw)/2);Tp=Math.max(12,vh-ch-24)}
  card.style.left=L+'px';card.style.top=Tp+'px';
 }
}
function tourShow(i,dir){
 const steps=TOUR.steps;
 while(i>=0&&i<steps.length){
  const s=steps[i];
  if(s.page&&S.page!==s.page){S.page=s.page;S.q='';S.f='';S.be=false;draw();scrollTo(0,0)}
  let ok=true;if(s.opt){try{ok=tVis(s.t())}catch(x){ok=false}}
  if(ok)break;
  i+=dir;
 }
 if(i>=steps.length){tourEnd();return}
 if(i<0)i=0;
 TOUR.i=i;
 const s=steps[i],N=steps.length,T=$('#tour'),card=T.querySelector('.tr-card');
 card.innerHTML=`<div class="ob-bar"><i style="width:${(i+1)/N*100}%"></i></div><div class="ob-step">Step ${i+1} of ${N}</div><h3>${s.h}</h3><p>${s.b}</p><div class="row"><button type="button" class="ghost" id="tr-s">Skip tour</button><span class="sp"></span>${i?'<button type="button" class="ghost" id="tr-b">Back</button>':''}<button type="button" class="pri" id="tr-n">${i===N-1?'Done':i===0?'Start':'Next'}</button></div>`;
 try{tourFocus(s.t&&s.t())}catch(x){}
 tourPos();
 const n=$('#tr-n');if(n)n.focus({preventScroll:true});
}
function tourKeys(e){
 if(!TOUR)return;
 if(e.key==='Escape'){e.preventDefault();tourEnd()}
 else if(e.key==='ArrowRight'){e.preventDefault();tourShow(TOUR.i+1,1)}
 else if(e.key==='ArrowLeft'&&TOUR.i>0){e.preventDefault();tourShow(TOUR.i-1,-1)}
}
function tourStart(){
 if(TOUR||!S.u||!S.d||$('#app').hidden)return;
 const T=document.createElement('div');T.id='tour';T.setAttribute('role','dialog');T.setAttribute('aria-modal','true');T.setAttribute('aria-label','App tour');
 T.innerHTML='<div class="tr-hole"></div><div class="tr-card" aria-live="polite"></div>';
 T.onclick=e=>{const b=e.target.closest('button');if(!b||!TOUR)return;
  if(b.id==='tr-n')tourShow(TOUR.i+1,1);else if(b.id==='tr-b')tourShow(TOUR.i-1,-1);else if(b.id==='tr-s')tourEnd()};
 document.body.appendChild(T);
 TOUR={i:0,steps:tourSteps(),orig:S.page,tm:setInterval(tourPos,400)};
 document.addEventListener('keydown',tourKeys);addEventListener('resize',tourPos);addEventListener('scroll',tourPos,{passive:true});
 tourShow(0,1);
}
function tourEnd(){
 if(!TOUR)return;
 const o=TOUR.orig;clearInterval(TOUR.tm);TOUR=null;tourMark();
 document.removeEventListener('keydown',tourKeys);removeEventListener('resize',tourPos);removeEventListener('scroll',tourPos);
 const T=$('#tour');if(T)T.remove();
 if(S.u&&S.d&&o&&S.page!==o){S.page=o;S.q='';S.f='';S.be=false;draw();scrollTo(0,0)}
}
function tourAuto(){
 if(TOUR||!S.u||S.lock||!['student','editor'].includes(S.u.role)||tourSeen())return;
 let n=0;
 const w=()=>{
  if(TOUR||!S.u||!S.d||S.lock||$('#app').hidden)return;
  const busy=document.getElementById('splash')||$('#modal').classList.contains('on');
  if(busy){if(n++<20)setTimeout(w,500);return}
  tourStart();
 };
 setTimeout(w,700);
}

/* ---------- boot ---------- */
if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)$('#instl').hidden=true;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{
 const t0=Date.now(),sp=$('#sp'),spl=$('#splash');
 const slow=setTimeout(()=>sp.textContent='Waking up the server, this can take a few seconds…',4500);
 const done=()=>{clearTimeout(slow);setTimeout(()=>{spl.classList.add('off');setTimeout(()=>spl.remove(),600)},Math.max(0,1100-(Date.now()-t0)))};
 const go=async()=>{
  if(!S.t){$('#login').hidden=false;return done()}
  try{await start();done()}
  catch(e){
   if(/no internet|cannot be reached/i.test(e.message)&&showOfflineTrip()){clearTimeout(slow);done();return}
   if(/Cannot reach|no internet|cannot be reached/i.test(e.message)){
    clearTimeout(slow);sp.textContent='Could not connect. Check your internet and try again.';$('#splash .ld').hidden=true;
    const b=document.createElement('button');b.className='pri';b.textContent='Try again';
    b.onclick=()=>{b.remove();$('#splash .ld').hidden=false;sp.textContent='Connecting…';go()};spl.appendChild(b);
   }else{$('#login').hidden=false;done()}
  }
 };
 go();
})();
